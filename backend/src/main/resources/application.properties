spring.application.name=UltraVExpotech

# =====================================================================
# Banco padrao: H2 em memoria (NAO precisa instalar nada)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:ultravdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Para usar MySQL ao inves de H2:
#   1) Comente as 7 linhas acima
#   2) Descomente as 4 linhas abaixo
#   3) Ajuste a senha (linha password) caso seja diferente
#   4) Rode o script database/ultrav.sql ou deixe o Hibernate criar
# =====================================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/ultrav?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=1234
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
